<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="%VITE_TRIPICIAN_LOGO%" />

    <!-- What is here and what is NOT, and why the split matters.

         The words come from src/pages/LandingPage/landingContent.ts. vite.config.ts
         fills the three landing:* markers below at build time (landingStatic.ts),
         so the page, these tags and the plain-HTML copy can never drift apart.

         landing:social - the title and the og:/twitter: tags. These STAY on every
         path: social scrapers do not run JavaScript, so Helmet never reaches them
         and these are the only thing WhatsApp, Facebook and LinkedIn ever see.

         landing:head and landing:body - the home page only: its description,
         canonical, JSON-LD and the page as plain HTML for crawlers that do not run
         JavaScript (most AI crawlers). The build writes app.html without them and
         vercel.json serves app.html for every other path. main.tsx removes them
         before React renders, so <Seo> is the only description and canonical a
         browser ever holds.

         Never hardcode a canonical or a description here outside landing:head:
         a tag in this file survives on every route, and a canonical of "/" on
         every URL tells search engines every page is a duplicate of the home page. -->
    <!--landing:social-->
    <!--landing:head-->

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Tripician" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Fonts: preconnect + link beats CSS @import (no render-blocking CSS chain, earlier fetch)

         Bricolage Grotesque is the one face (2026-11, as on mobile): the closest
         open-licensed match to the logo's lettering. It replaced Plus Jakarta Sans
         + Playfair Display.

         Requested as variable axes, not a static weight list: `wght` 400..700
         (700 is the top of the ladder by design; with `font-synthesis: none` in
         index.css an unlisted weight rounds silently) and `opsz` 12..96, which
         the browser sets from the font size, so headings get the tighter display
         cut and body copy the open text cut. Keep the axis form if this face is
         ever swapped again. There is no italic cut. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap"
    />
  </head>
  <body>
    <div id="root"><!--landing:body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
