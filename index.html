<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="%VITE_TRIPICIAN_LOGO_ICON_URL%" />

    <!-- What is here and what is NOT, and why the split matters.

         react-helmet-async can only replace tags it rendered itself. A tag
         hardcoded in this file survives on every route, so it does not act as a
         fallback: it sits in the document ahead of the per-page tag and is the
         one a reader takes first.

         That made the canonical actively harmful. Every URL on the site declared
         https://tripician.com/ as its canonical, which tells a search engine that
         every page is a duplicate of the home page and only the home page should
         be indexed. It is now rendered per page by <Seo>, which is the only place
         that knows the path.

         The description left for the same reason: <Seo> writes a real one per
         page and it was being shadowed by the home page's.

         The og: and twitter: tags below deliberately STAY. Social scrapers do not
         run JavaScript, so Helmet never reaches them and these really are the only
         thing WhatsApp, Facebook and LinkedIn ever see. Keep them identical to
         LandingPage's <Seo> props: they have drifted apart once before, leaving
         the title saying "community" while the share cards said something else. -->
    <title>Tripician, Social Network And Trip Planner For Travellers</title>

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:title" content="Tripician, Social Network And Trip Planner For Travellers" />
    <meta property="og:description" content="Browse real itineraries published by travellers who took them - the route, the stays, the places worth the detour. Copy any trip into your own plan, and plan it with your crew. Free to join." />
    <meta property="og:image" content="https://tripician.com/og-cover.jpg" />
    <meta property="og:url" content="https://tripician.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tripician" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tripician, Social Network And Trip Planner For Travellers" />
    <meta name="twitter:description" content="Browse real itineraries published by travellers who took them - the route, the stays, the places worth the detour. Copy any trip into your own plan, and plan it with your crew. Free to join." />
    <meta name="twitter:image" content="https://tripician.com/og-cover.jpg" />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Tripician" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Fonts: preconnect + link beats CSS @import (no render-blocking CSS chain, earlier fetch)

         Plus Jakarta Sans is the UI face, requested as a variable axis (400..700)
         rather than a static weight list. The old list stopped at the values it
         named, and combined with `font-synthesis: none` in index.css any weight
         not on it rounded to the nearest one that was - so the 550/650/750 the
         theme asked for all rendered as 600/700/800, i.e. heavier than written.
         The axis is also one file instead of six. 700 is the top of the ladder
         by design. Keep the axis form if this face is ever swapped again.

         Playfair Display is the display face and its scope is now NARROW: story
         titles and the story reading page, nothing else. A geometric sans was
         once tried in that slot and pulled back out because at display sizes it
         read as interface chrome rather than as a heading. That finding still
         holds - which is why the serif survives on the one surface that has to
         read as authored rather than as product. `story-serif.guard.test.ts`
         enforces the boundary.

         The `1,600` axis is a real italic cut, not a synthesised oblique -
         `font-synthesis: none` in index.css means an unrequested italic would
         render upright, so the emphasis in the auth panel depends on it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
