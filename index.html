<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="%VITE_TRIPICIAN_LOGO_ICON_URL%" />

    <!-- Primary SEO -->
    <title>Tripician, A Global Travel Community &amp; AI Trip Planner</title>
    <meta name="description" content="Join a global community of travellers and plan trips together with Navia, the world's first agentic travel AI. Group trip chat, vibe matching, live risk monitoring &amp; more - free forever." />
    <link rel="canonical" href="https://tripician.com/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:title" content="Tripician, A Global Travel Community &amp; AI Trip Planner" />
    <meta property="og:description" content="Find your travel tribe and plan trips together with Navia, the world's first agentic travel AI. Group chat planning, vibe matching, and live risk monitoring - free forever." />
    <meta property="og:image" content="https://tripician.com/og-cover.jpg" />
    <meta property="og:url" content="https://tripician.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tripician" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tripician, A Global Travel Community &amp; AI Trip Planner" />
    <meta name="twitter:description" content="Find your travel tribe and plan trips together with Navia, the world's first agentic travel AI. Group chat planning, vibe matching, and live risk monitoring - free forever." />
    <meta name="twitter:image" content="https://tripician.com/og-cover.jpg" />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Tripician" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Fonts: preconnect + link beats CSS @import (no render-blocking CSS chain, earlier fetch) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500;1,600;1,700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
