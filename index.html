<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="%VITE_TRIPICIAN_LOGO%" />

    <!-- What is here and what is NOT, and why the split matters.

         react-helmet-async can only replace tags it rendered itself. A tag
         hardcoded in this file survives on every route, so it does not act as a
         fallback: it sits in the document ahead of the per-page tag and is the
         one a reader takes first.

         That made the canonical actively harmful. Every URL on the site declared
         https://tripician.com/ as its canonical, which tells a search engine that
         every page is a duplicate of the home page and only the home page should
         be indexed. It is now rendered per page by <Seo>, which is the only place
         that knows the path.

         The description left for the same reason: <Seo> writes a real one per
         page and it was being shadowed by the home page's.

         The og: and twitter: tags below deliberately STAY. Social scrapers do not
         run JavaScript, so Helmet never reaches them and these really are the only
         thing WhatsApp, Facebook and LinkedIn ever see. Keep them identical to
         LandingPage's <Seo> props: they have drifted apart once before, leaving
         the title saying "community" while the share cards said something else. -->
    <title>Tripician, A Social Network For Travellers And Explorers</title>

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:title" content="Tripician, A Social Network For Travellers And Explorers" />
    <meta property="og:description" content="Travellers publish the trips they actually took. Read them, ask the people who went, and find others to travel with. Plan your own with your crew or with Tripician Intelligence. Free to join." />
    <meta property="og:image" content="https://tripician.com/og-cover.jpg" />
    <meta property="og:url" content="https://tripician.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tripician" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tripician, A Social Network For Travellers And Explorers" />
    <meta name="twitter:description" content="Travellers publish the trips they actually took. Read them, ask the people who went, and find others to travel with. Plan your own with your crew or with Tripician Intelligence. Free to join." />
    <meta name="twitter:image" content="https://tripician.com/og-cover.jpg" />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Tripician" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Fonts: preconnect + link beats CSS @import (no render-blocking CSS chain, earlier fetch)

         Bricolage Grotesque is the one face (2026-11, as on mobile): the closest
         open-licensed match to the logo's lettering. It replaced Plus Jakarta Sans
         + Playfair Display.

         Requested as variable axes, not a static weight list: `wght` 400..700
         (700 is the top of the ladder by design; with `font-synthesis: none` in
         index.css an unlisted weight rounds silently) and `opsz` 12..96, which
         the browser sets from the font size, so headings get the tighter display
         cut and body copy the open text cut. Keep the axis form if this face is
         ever swapped again. There is no italic cut. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
